<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>IA Holográfica · Control por Gestos</title>
<style>
  :root{ --verde:#38ffb0; --cian:#00d1ff; --fondo:#05070d; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; background:var(--fondo); color:#e8f6ff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; }

  #stage{ position:fixed; inset:0; overflow:hidden; }
  #cam{ position:absolute; inset:0; width:100%; height:100%;
        object-fit:contain; transform:scaleX(-1); background:#000; }
  #overlay{ position:absolute; inset:0; width:100%; height:100%; }

  #hud{ position:absolute; top:0; left:0; right:0; padding:10px;
        display:flex; gap:8px; flex-wrap:wrap; align-items:center;
        pointer-events:none; font-size:13px; z-index:5; }
  .chip{ background:rgba(6,14,24,.72); border:1px solid rgba(56,255,176,.35);
         border-radius:999px; padding:5px 11px; backdrop-filter:blur(6px); }
  .chip b{ color:var(--verde); }

  #lista{ position:absolute; left:10px; bottom:140px; display:flex;
          flex-direction:column; gap:6px; font-size:13px; pointer-events:none; z-index:5; }
  #lista div{ background:rgba(6,14,24,.72); border-radius:10px;
              padding:6px 10px; border-left:3px solid var(--verde); }
  #lista div.c1{ border-left-color:var(--cian); }

  /* Panel de control de los 5 videos */
  #panelVideos{ position:absolute; left:10px; right:10px; bottom:10px; 
                display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; z-index:5; }
  .vBtn{ background:rgba(6,14,24,.85); border:1px solid rgba(56,255,176,.4);
         color:#e8f6ff; padding:8px 12px; border-radius:8px; font-size:11px; 
         white-space:nowrap; cursor:pointer; font-weight:600; }
  .vBtn.activo{ background:var(--verde); color:#04140d; border-color:var(--verde); }

  /* Ventanita del video principal */
  #pip{ position:absolute; right:10px; bottom:65px; width:40%; max-width:240px;
        aspect-ratio:16/9; border-radius:12px; overflow:hidden;
        border:1.5px solid rgba(56,255,176,.5); background:#0a1018;
        display:flex; align-items:center; justify-content:center; z-index:5; }
  #pip video{ width:100%; height:100%; object-fit:cover; }

  /* Pantalla de inicio */
  #inicio{ position:absolute; inset:0; background:rgba(3,6,12,.94);
           display:flex; flex-direction:column; align-items:center;
           justify-content:center; gap:16px; padding:24px; text-align:center; z-index:10; }
  #inicio h1{ font-size:19px; margin:0; font-weight:600; }
  #inicio p{ margin:0; font-size:13px; color:#8fb4c9; max-width:340px; line-height:1.5; }
  #btn{ background:var(--verde); color:#04140d; border:0; border-radius:999px;
        padding:14px 34px; font-size:16px; font-weight:700; }
  #btn:disabled{ opacity:.5; }
  .oculto{ display:none !important; }
  #error{ color:#ff7b7b; font-size:13px; max-width:340px; line-height:1.5; }
</style>
</head>
<body>

<div id="stage">
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>

  <div id="hud">
    <div class="chip"><b id="fps">0</b> fps</div>
    <div class="chip"><b id="nManos">0</b>/2 manos</div>
    <div class="chip" id="estadoAccion">Esperando seña...</div>
  </div>

  <div id="lista"></div>

  <!-- Reproductor de video flotante -->
  <div id="pip">
    <video id="pipVideo" playsinline loop></video>
  </div>

  <!-- Botones para los 5 videos precargados desde enlaces web -->
  <div id="panelVideos">
    <button class="vBtn activo" onclick="cambiarVideo(0)">Video 1: Intro</button>
    <button class="vBtn" onclick="cambiarVideo(1)">Video 2: Problema</button>
    <button class="vBtn" onclick="cambiarVideo(2)">Video 3: Solución</button>
    <button class="vBtn" onclick="cambiarVideo(3)">Video 4: Demostración</button>
    <button class="vBtn" onclick="cambiarVideo(4)">Video 5: Cierre</button>
  </div>

  <div id="inicio">
    <h1>🤖 IA Holográfica Interactiva</h1>
    <p>Controla 5 videos institucionales usando gestos con tus manos frente a la cámara.</p>
    <button id="btn">Iniciar sistema</button>
    <div id="error"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>

<script>
/* ============================================================
   CONFIGURACIÓN DE LOS 5 VIDEOS (ENLACES DIRECTOS)
   Reemplaza estos enlaces de ejemplo por los links directos a tus videos
   ============================================================ */
const LIKES_VIDEOS = [
  "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
  "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
  "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4",
  "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4",
  "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4"
];

let videoActualIdx = 0;
const pipVideo = $('pipVideo');

function cambiarVideo(idx) {
  videoActualIdx = idx;
  pipVideo.src = LIKES_VIDEOS[idx];
  pipVideo.play().catch(()=>{});
  
  // Actualizar estilos de botones
  document.querySelectorAll('.vBtn').forEach((b, i) => {
    b.classList.toggle('activo', i === idx);
  });
}

// Inicializar el primer video
pipVideo.src = LIKES_VIDEOS[0];

/* ============================================================
   CONFIGURACIÓN DE VISION ARTIFICIAL
   ============================================================ */
const INVERTIR_ETIQUETA = true;
const MAX_MANOS = 2;
const CONEXIONES = [
  [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],[0,17]
];
const COLORES = ['#38ffb0', '#00d1ff'];

const $ = id => document.getElementById(id);
const stage = $('stage');
const video = $('cam');
const canvas = $('overlay');
const ctx = canvas.getContext('2d');
const btn = $('btn');
const inicio = $('inicio');
const errBox = $('error');

let cw = 0, ch = 0;
let corriendo = false;
let frames = 0, fps = 0, tFps = performance.now();
let cooldownGesto = 0; // Para evitar cambios muy bruscos por segundo

function ajustar() {
  const r = stage.getBoundingClientRect();
  cw = canvas.width = Math.round(r.width);
  ch = canvas.height = Math.round(r.height);
}
window.addEventListener('resize', ajustar);

function proy(lm) {
  const vw = video.videoWidth || 1;
  const vh = video.videoHeight || 1;
  const s = Math.min(cw / vw, ch / vh);
  const dw = vw * s, dh = vh * s;
  const ox = (cw - dw) / 2, oy = (ch - dh) / 2;
  return { x: cw - (ox + lm.x * dw), y: oy + lm.y * dh };
}

function contarDedos(lm, esDerecha) {
  let n = 0;
  const pares = [[8,6],[12,10],[16,14],[20,18]];
  for (const [punta, nudillo] of pares) {
    if (lm[punta].y < lm[nudillo].y - 0.03) n++;
  }
  const dx = lm[4].x - lm[3].x;
  if (esDerecha ? dx < -0.015 : dx > 0.015) n++;
  return n;
}

function nombreGesto(n) {
  if (n === 0) return 'Puño (Pausar)';
  if (n === 5) return 'Abierta (Reproducir)';
  return n + ' dedos';
}

/* ============================================================
   LÓGICA DE CONTROL POR GESTOS
   ============================================================ */
function procesarControlPorGestos(totalDedos, nManos) {
  if (cooldownGesto > 0) {
    cooldownGesto--;
    return;
  }

  // Si se muestra el puño (0 dedos), pausa el video
  if (nManos > 0 && totalDedos === 0) {
    if (!pipVideo.paused) {
      pipVideo.pause();
      $('estadoAccion').textContent = "🛑 Video Pausado por Seña";
      cooldownGesto = 30; // Esperar 30 frames para relajar la lectura
    }
  }
  // Si se muestra la mano abierta (5 dedos), reproduce el video
  else if (nManos > 0 && totalDedos >= 5) {
    if (pipVideo.paused) {
      pipVideo.play();
      $('estadoAccion').textContent = "▶️ Video Reproduciendo";
      cooldownGesto = 30;
    }
  }
}

/* ============================================================
   DIBUJO EN CANVAS
   ============================================================ */
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function dibujarMano(lm, idx, lado, dedos) {
  const color = COLORES[idx % COLORES.length];
  const pts = lm.map(proy);
  const grosor = Math.max(2, Math.round(cw / 220));

  ctx.lineCap = 'round';
  ctx.strokeStyle = color;
  ctx.lineWidth = grosor;
  ctx.globalAlpha = 0.9;
  ctx.beginPath();
  for (const [a, b] of CONEXIONES) {
    ctx.moveTo(pts[a].x, pts[a].y);
    ctx.lineTo(pts[b].x, pts[b].y);
  }
  ctx.stroke();

  ctx.fillStyle = color;
  for (let i = 0; i < pts.length; i++) {
    ctx.beginPath();
    ctx.arc(pts[i].x, pts[i].y, 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* ============================================================
   MEDIAPIPE HANDS
   ============================================================ */
const hands = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`
});

hands.setOptions({
  maxNumHands: MAX_MANOS,
  modelComplexity: 0,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.5
});

hands.onResults(res => {
  frames++;
  const ahora = performance.now();
  if (ahora - tFps >= 1000) {
    fps = Math.round(frames * 1000 / (ahora - tFps));
    frames = 0; tFps = ahora;
    $('fps').textContent = fps;
  }

  ctx.clearRect(0, 0, cw, ch);

  const manos = res.multiHandLandmarks || [];
  const etiquetas = res.multiHandedness || [];
  const lista = $('lista');
  lista.innerHTML = '';

  let totalDedos = 0;

  for (let i = 0; i < manos.length; i++) {
    let et = etiquetas[i] ? etiquetas[i].label : 'Desconocida';
    if (INVERTIR_ETIQUETA) et = (et === 'Right') ? 'Left' : 'Right';

    const esDerecha = (et === 'Right');
    const lado = esDerecha ? 'Derecha' : 'Izquierda';
    const dedos = contarDedos(manos[i], esDerecha);

    totalDedos += dedos;
    dibujarMano(manos[i], i, lado, dedos);

    const fila = document.createElement('div');
    if (i === 1) fila.className = 'c1';
    fila.textContent = `Mano ${i + 1}: ${dedos} dedos (${nombreGesto(dedos)})`;
    lista.appendChild(fila);
  }

  $('nManos').textContent = manos.length;
  
  // Ejecutar el control por gestos si hay manos detectadas
  if(manos.length > 0) {
    procesarControlPorGestos(totalDedos, manos.length);
  }
});

async function bucle() {
  if (!corriendo) return;
  if (video.readyState >= 2) {
    try { await hands.send({ image: video }); } catch (e) {}
  }
  if (corriendo) requestAnimationFrame(bucle);
}

btn.addEventListener('click', async () => {
  errBox.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Iniciando cámara...';

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 480 }, height: { ideal: 360 }, frameRate: { ideal: 24, max: 30 } },
      audio: false
    });

    video.srcObject = stream;
    await video.play();
    ajustar();
    try { await hands.initialize(); } catch (e) {}

    inicio.classList.add('oculto');
    corriendo = true;
    bucle();
  } catch (e) {
    errBox.textContent = 'Error al abrir cámara: ' + (e.message || e.name);
    btn.disabled = false;
    btn.textContent = 'Reintentar';
  }
});

ajustar();
</script>
</body>
</html>
