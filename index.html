<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>IA Holográfica · Control Total por Señas</title>
<style>
  :root{ --verde:#38ffb0; --cian:#00d1ff; --fondo:#05070d; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; background:var(--fondo); color:#e8f6ff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; }

  #stage{ position:fixed; inset:0; overflow:hidden; }
  #cam{ position:absolute; inset:0; width:100%; height:100%;
        object-fit:contain; transform:scaleX(-1); background:#000; }
  #overlay{ position:absolute; inset:0; width:100%; height:100%; }

  #hud{ position:absolute; top:0; left:0; right:0; padding:10px;
        display:flex; gap:8px; flex-wrap:wrap; align-items:center;
        pointer-events:none; font-size:13px; z-index:5; }
  .chip{ background:rgba(6,14,24,.72); border:1px solid rgba(56,255,176,.35);
         border-radius:999px; padding:5px 11px; backdrop-filter:blur(6px); }
  .chip b{ color:var(--verde); }

  #lista{ position:absolute; left:10px; bottom:80px; display:flex;
          flex-direction:column; gap:6px; font-size:13px; pointer-events:none; z-index:5; }
  #lista div{ background:rgba(6,14,24,.72); border-radius:10px;
              padding:6px 10px; border-left:3px solid var(--verde); }
  #lista div.c1{ border-left-color:var(--cian); }

  /* Ventanita del video flotante */
  #pip{ position:absolute; right:10px; bottom:10px; width:45%; max-width:250px;
        aspect-ratio:16/9; border-radius:12px; overflow:hidden;
        border:1.5px solid rgba(56,255,176,.5); background:#0a1018;
        display:flex; align-items:center; justify-content:center; z-index:5; }
  #pip video{ width:100%; height:100%; object-fit:cover; }

  /* Pantalla de inicio */
  #inicio{ position:absolute; inset:0; background:rgba(3,6,12,.94);
           display:flex; flex-direction:column; align-items:center;
           justify-content:center; gap:16px; padding:24px; text-align:center; z-index:10; }
  #inicio h1{ font-size:19px; margin:0; font-weight:600; }
  #inicio p{ margin:0; font-size:13px; color:#8fb4c9; max-width:340px; line-height:1.5; }
  #btn{ background:var(--verde); color:#04140d; border:0; border-radius:999px;
        padding:14px 34px; font-size:16px; font-weight:700; }
  #btn:disabled{ opacity:.5; }
  .oculto{ display:none !important; }
  #error{ color:#ff7b7b; font-size:13px; max-width:340px; line-height:1.5; }
</style>
</head>
<body>

<div id="stage">
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>

  <div id="hud">
    <div class="chip">Video: <b id="lblVideoNum">1</b>/5</div>
    <div class="chip" id="estadoAccion">Muestra 1 dedo para pasar al siguiente</div>
  </div>

  <div id="lista"></div>

  <!-- Reproductor de video flotante -->
  <div id="pip">
    <video id="pipVideo" playsinline></video>
  </div>

  <div id="inicio">
    <h1>🤖 IA Holográfica por Gestos</h1>
    <p>Controla tus 5 videos de forma totalmente gestual frente a la cámara de tu celular.</p>
    <button id="btn">Iniciar sistema</button>
    <div id="error"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>

<script>
/* ============================================================
   TUS 5 ESPACIOS DE VIDEOS (PEGA TUS ENLACES EXTERNOS AQUÍ)
   Ejemplo: "https://tu-sitio.com/video1.mp4" o enlaces directos
   ============================================================ */
const LIKES_VIDEOS = [
  "https://youtu.be/3Ax-vrlWeYY?si=dXvYsT43qeq0F_Ge", // ESPACIO VIDEO 1
  "https://youtu.be/I23tOKBo3fE?si=sWL0701T-sgpLKf3", // ESPACIO VIDEO 2
  "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4",     // ESPACIO VIDEO 3
  "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4", // ESPACIO VIDEO 4
  "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4"  // ESPACIO VIDEO 5
];

let videoActualIdx = 0;
const pipVideo = $('pipVideo');

function cargarVideo(idx) {
  videoActualIdx = idx;
  pipVideo.src = LIKES_VIDEOS[idx];
  pipVideo.load();
  pipVideo.play().catch(()=>{});
  $('lblVideoNum').textContent = (idx + 1);
}

/* ============================================================
   CONFIGURACIÓN DE VISIÓN ARTIFICIAL
   ============================================================ */
const INVERTIR_ETIQUETA = true;
const MAX_MANOS = 1; // 1 mano para simplificar y mandar comandos precisos
const CONEXIONES = [
  [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],[0,17]
];
const COLORES = ['#38ffb0'];

const $ = id => document.getElementById(id);
const stage = $('stage');
const video = $('cam');
const canvas = $('overlay');
const ctx = canvas.getContext('2d');
const btn = $('btn');
const inicio = $('inicio');
const errBox = $('error');

let cw = 0, ch = 0;
let corriendo = false;
let cooldownGesto = 0; // Evita que cambie de video locamente por segundo

function ajustar() {
  const r = stage.getBoundingClientRect();
  cw = canvas.width = Math.round(r.width);
  ch = canvas.height = Math.round(r.height);
}
window.addEventListener('resize', ajustar);

function proy(lm) {
  const vw = video.videoWidth || 1;
  const vh = video.videoHeight || 1;
  const s = Math.min(cw / vw, ch / vh);
  const dw = vw * s, dh = vh * s;
  const ox = (cw - dw) / 2, oy = (ch - dh) / 2;
  return { x: cw - (ox + lm.x * dw), y: oy + lm.y * dh };
}

function contarDedos(lm, esDerecha) {
  let n = 0;
  const pares = [[8,6],[12,10],[16,14],[20,18]];
  for (const [punta, nudillo] of pares) {
    if (lm[punta].y < lm[nudillo].y - 0.03) n++;
  }
  const dx = lm[4].x - lm[3].x;
  if (esDerecha ? dx < -0.015 : dx > 0.015) n++;
  return n;
}

/* ============================================================
   CONTROL TOTAL POR SEÑAS
   ============================================================ */
function procesarControlPorGestos(totalDedos) {
  if (cooldownGesto > 0) {
    cooldownGesto--;
    return;
  }

  // 1 DEDO (Señalando): Pasa al siguiente video de forma circular (1 -> 2 -> 3 -> 4 -> 5 -> 1)
  if (totalDedos === 1) {
    videoActualIdx = (videoActualIdx + 1) % LIKES_VIDEOS.length;
    cargarVideo(videoActualIdx);
    $('estadoAccion').textContent = `⏭️ Pasando al Video ${videoActualIdx + 1}`;
    cooldownGesto = 45; // Pausa de seguridad de aprox 1.5 segundos para que no salte de video solo
  }
  // PUÑO (0 dedos): Pausa
  else if (totalDedos === 0) {
    if (!pipVideo.paused) {
      pipVideo.pause();
      $('estadoAccion').textContent = "🛑 Video Pausado (Puño)";
      cooldownGesto = 30;
    }
  }
  // MANO ABIERTA (5 dedos): Reproduce
  else if (totalDedos >= 5) {
    if (pipVideo.paused) {
      pipVideo.play();
      $('estadoAccion').textContent = "▶️ Reproduciendo (Mano Abierta)";
      cooldownGesto = 30;
    }
  }
}

/* ============================================================
   DIBUJO EN CANVAS
   ============================================================ */
function dibujarMano(lm, lado, dedos) {
  const pts = lm.map(proy);
  const grosor = Math.max(2, Math.round(cw / 220));

  ctx.lineCap = 'round';
  ctx.strokeStyle = COLORES[0];
  ctx.lineWidth = grosor;
  ctx.globalAlpha = 0.9;
  ctx.beginPath();
  for (const [a, b] of CONEXIONES) {
    ctx.moveTo(pts[a].x, pts[a].y);
    ctx.lineTo(pts[b].x, pts[b].y);
  }
  ctx.stroke();

  ctx.fillStyle = COLORES[0];
  for (let i = 0; i < pts.length; i++) {
    ctx.beginPath();
    ctx.arc(pts[i].x, pts[i].y, 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* ============================================================
   MEDIAPIPE HANDS
   ============================================================ */
const hands = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`
});

hands.setOptions({
  maxNumHands: MAX_MANOS,
  modelComplexity: 0,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.5
});

hands.onResults(res => {
  ctx.clearRect(0, 0, cw, ch);

  const manos = res.multiHandLandmarks || [];
  const etiquetas = res.multiHandedness || [];
  const lista = $('lista');
  lista.innerHTML = '';

  if (manos.length > 0) {
    let et = etiquetas[0] ? etiquetas[0].label : 'Desconocida';
    if (INVERTIR_ETIQUETA) et = (et === 'Right') ? 'Left' : 'Right';

    const esDerecha = (et === 'Right');
    const dedos = contarDedos(manos[0], esDerecha);

    dibujarMano(manos[0], esDerecha ? 'Derecha' : 'Izquierda', dedos);

    const fila = document.createElement('div');
    fila.textContent = `Gesto detectado: ${dedos} dedo(s)`;
    lista.appendChild(fila);

    // Procesar la seña para controlar los videos
    procesarControlPorGestos(dedos);
  } else {
    $('lista.innerHTML = ""');
  }
});

async function bucle() {
  if (!corriendo) return;
  if (video.readyState >= 2) {
    try { await hands.send({ image: video }); } catch (e) {}
  }
  if (corriendo) requestAnimationFrame(bucle);
}

btn.addEventListener('click', async () => {
  errBox.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Iniciando cámara...';

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 480 }, height: { ideal: 360 }, frameRate: { ideal: 24, max: 30 } },
      audio: false
    });

    video.srcObject = stream;
    await video.play();
    ajustar();
    
    // Cargar el primer video de la lista de golpe
    cargarVideo(0);

    try { await hands.initialize(); } catch (e) {}

    inicio.classList.add('oculto');
    corriendo = true;
    bucle();
  } catch (e) {
    errBox.textContent = 'Error al abrir cámara: ' + (e.message || e.name);
    btn.disabled = false;
    btn.textContent = 'Reintentar';
  }
});

ajustar();
</script>
</body>
</html>
